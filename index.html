<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHaven - Secret Confession & Support Wall</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body { 
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc; 
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hero Header */
        .hero {
            text-align: center;
            margin-bottom: 30px;
            max-width: 650px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to right, #38bdf8, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .hero p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Main Form Glass Card */
        .container { 
            width: 100%;
            max-width: 650px; 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
        }
        .container h3 {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 18px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 13px 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(15, 23, 42, 0.7); 
            color: #fff; 
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button.post-btn { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px;
            border-radius: 12px; 
            border: none; 
            background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        button.post-btn:hover { 
            opacity: 0.95;
            transform: translateY(-2px);
        }
        
        /* Wall Section */
        .wall-section {
            width: 100%;
            max-width: 650px;
        }
        .wall-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        .feedback-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Confession Cards */
        .feedback-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card-name {
            font-weight: 600;
            font-size: 14px;
            color: #f1f5f9;
        }
        .card-category {
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 30px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }
        .card-message {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .no-data {
            text-align: center;
            color: #64748b;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>SafeHaven 🤍</h1>
        <p>A safe and aesthetic space to share your deepest thoughts anonymously and read community confessions.</p>
    </div>

    <div class="container">
        <h3>✨ Share Your Confession</h3>
        
        <div class="input-group">
            <label>Your Name / Anonymous</label>
            <input type="text" id="fbName" placeholder="Optional (e.g., Anonymous)">
        </div>

        <div class="input-group">
            <label>Category</label>
            <select id="fbCategory">
                <option value="Secret Confession">Secret Confession</option>
                <option value="Need Support / Low Phase">Need Support / Low Phase</option>
                <option value="Seeking Advice">Seeking Advice</option>
                <option value="Random Deep Thought">Random Deep Thought</option>
            </select>
        </div>

        <div class="input-group">
            <label>Your Message</label>
            <textarea id="fbMessage" placeholder="Write your thoughts here..."></textarea>
        </div>

        <button class="post-btn" onclick="submitFeedback()">Post Anonymously ✨</button>
    </div>

    <div class="wall-section">
        <div class="wall-title">💬 Community Confessions Wall</div>
        <div class="feedback-grid" id="feedbackList">
            <div class="no-data">Loading stories of hope...</div>
        </div>
    </div>

    <script>
        // Updated Supabase Connection Setup with correct credentials
        const SUPABASE_URL = 'https://ggeehkmqxgtvihgnxhak.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0aVWFXbMIQoYT6Kj63PkJg_dz9ERrmH';

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch Confessions from 'feedbacks' table
        async function loadFeedbacks() {
            try {
                const { data: posts, error } = await dbClient
                    .from('feedbacks')
                    .select('*')
                    .order('created_at', { ascending: false });

                const grid = document.getElementById("feedbackList");

                if (error) {
                    console.error('Fetch Error:', error);
                    grid.innerHTML = '<div class="no-data">Failed to load wall.</div>';
                    return;
                }

                if (!posts || posts.length === 0) {
                    grid.innerHTML = '<div class="no-data">No confessions yet. Be the first to share! 🤍</div>';
                    return;
                }

                grid.innerHTML = "";
                posts.forEach(item => {
                    let card = document.createElement("div");
                    card.className = "feedback-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-name">👤 ${item.name || 'Anonymous'}</span>
                            <span class="card-category">${item.category || 'General'}</span>
                        </div>
                        <div class="card-message">${item.message}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Catch Error:', err);
            }
        }

        // Submit New Confession
        async function submitFeedback() {
            let name = document.getElementById("fbName").value.trim();
            let category = document.getElementById("fbCategory").value;
            let message = document.getElementById("fbMessage").value.trim();

            if(message === "") {
                alert("Please write a message before posting!");
                return;
            }

            const { error } = await dbClient
                .from('feedbacks')
                .insert([
                    { name: name || 'Anonymous', category: category, message: message }
                ]);

            if (error) {
                console.error('Insert Error:', error);
                alert('Failed to post confession.');
            } else {
                alert('Posted securely to SafeHaven! 🤍');
                document.getElementById("fbName").value = "";
                document.getElementById("fbMessage").value = "";
                loadFeedbacks();
            }
        }

        window.onload = loadFeedbacks;
    </script>
</body>
</html>
