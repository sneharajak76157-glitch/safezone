<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHaven - Aesthetic Confession & Support Wall</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #f8fafc; 
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hero Header */
        .hero {
            text-align: center;
            margin-bottom: 35px;
            max-width: 650px;
            animation: fadeIn 1s ease-in-out;
        }
        .hero h1 {
            font-size: 46px;
            font-weight: 700;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(to right, #38bdf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 15px rgba(192, 132, 252, 0.4));
        }
        .hero p {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        /* Main Form Glass Card */
        .container { 
            width: 100%;
            max-width: 650px; 
            background: rgba(30, 41, 59, 0.45); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 45px;
        }
        .container h3 {
            font-size: 19px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 14px 18px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            background: rgba(15, 23, 42, 0.6); 
            color: #fff; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }
        textarea {
            resize: vertical;
            height: 110px;
        }
        button.post-btn { 
            width: 100%; 
            padding: 15px; 
            margin-top: 12px;
            border-radius: 14px; 
            border: none; 
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(192, 132, 252, 0.4);
            transition: all 0.3s ease;
        }
        button.post-btn:hover { 
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(192, 132, 252, 0.6);
        }
        
        /* Wall Section */
        .wall-section {
            width: 100%;
            max-width: 650px;
        }
        .wall-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 22px;
            text-align: center;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .feedback-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Gorgeous Aesthetic Cards */
        .feedback-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .feedback-card:hover {
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateY(-3px);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-name {
            font-weight: 600;
            font-size: 14px;
            color: #f1f5f9;
        }
        .card-category {
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(192, 132, 252, 0.15);
            color: #e879f9;
            font-weight: 600;
            border: 1px solid rgba(192, 132, 252, 0.3);
            letter-spacing: 0.3px;
        }
        .card-message {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
        }
        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .hero h1 { font-size: 36px; }
            .container { padding: 22px; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>SafeHaven 🤍</h1>
        <p>A dreamy, safe space to share your secrets, moments, and thoughts anonymously with a supportive community.</p>
    </div>

    <div class="container">
        <h3>✨ Share Your Story</h3>
        
        <div class="input-group">
            <label>Your Name / Anonymous</label>
            <input type="text" id="fbName" placeholder="Optional (e.g., Anonymous)">
        </div>

        <div class="input-group">
            <label>Select Category</label>
            <select id="fbCategory">
                <option value="Secret Confession">🤫 Secret Confession</option>
                <option value="Darkest Secret">🖤 Darkest Secret</option>
                <option value="Manifestation">✨ Manifestation</option>
                <option value="Worst Moment">🌧️ Worst Moment</option>
                <option value="Best Moment">☀️ Best Moment</option>
                <option value="Funniest Moment">😂 Funniest Moment</option>
            </select>
        </div>

        <div class="input-group">
            <label>Your Message</label>
            <textarea id="fbMessage" placeholder="Write your heart out here..."></textarea>
        </div>

        <button class="post-btn" onclick="submitFeedback()">Post to Wall ✨</button>
    </div>

    <div class="wall-section">
        <div class="wall-title">💬 Community Wall</div>
        <div class="feedback-grid" id="feedbackList">
            <div class="no-data">Loading magical moments...</div>
        </div>
    </div>

    <script>
        // Supabase Connection Setup
        const SUPABASE_URL = 'https://ggeehkmqxgtvihgnxhak.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0aVWFXbMIQoYT6Kj63PkJg_dz9ERrmH';

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch Confessions from 'feedbacks' table
        async function loadFeedbacks() {
            try {
                const { data: posts, error } = await dbClient
                    .from('feedbacks')
                    .select('*')
                    .order('created_at', { ascending: false });

                const grid = document.getElementById("feedbackList");

                if (error) {
                    console.error('Fetch Error:', error);
                    grid.innerHTML = '<div class="no-data">Failed to load wall.</div>';
                    return;
                }

                if (!posts || posts.length === 0) {
                    grid.innerHTML = '<div class="no-data">No stories yet. Be the first one to share! 🤍</div>';
                    return;
                }

                grid.innerHTML = "";
                posts.forEach(item => {
                    let card = document.createElement("div");
                    card.className = "feedback-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-name">👤 ${item.name || 'Anonymous'}</span>
                            <span class="card-category">${item.category || 'General'}</span>
                        </div>
                        <div class="card-message">${item.message}</div>
                        <div class="card-footer">
                            <span style="font-size: 11px; color: #94a3b8;">Shared securely</span>
                            <button class="delete-btn" onclick="deletePost(${item.id})">Delete Post</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Catch Error:', err);
            }
        }

        // Submit New Confession
        async function submitFeedback() {
            let name = document.getElementById("fbName").value.trim();
            let category = document.getElementById("fbCategory").value;
            let message = document.getElementById("fbMessage").value.trim();

            if(message === "") {
                alert("Please write a message before posting!");
                return;
            }

            const { error } = await dbClient
                .from('feedbacks')
                .insert([
                    { name: name || 'Anonymous', category: category, message: message }
                ]);

            if (error) {
                console.error('Insert Error:', error);
                alert('Failed to post confession.');
            } else {
                alert('Posted securely to SafeHaven! 🤍');
                document.getElementById("fbName").value = "";
                document.getElementById("fbMessage").value = "";
                loadFeedbacks();
            }
        }

        // Delete Confession Function
        async function deletePost(id) {
            if(confirm("Are you sure you want to delete this post?")) {
                const { error } = await dbClient
                    .from('feedbacks')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('Delete Error:', error);
                    alert('Failed to delete post.');
                } else {
                    alert('Post deleted successfully!');
                    loadFeedbacks();
                }
            }
        }

        window.onload = loadFeedbacks;
    </script>
</body>
</html>
